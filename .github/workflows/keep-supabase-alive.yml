name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          SUPABASE_URL="https://kebsdwyyscmexgmjtoyq.supabase.co"
          SUPABASE_KEY="sb_publishable_cab27OsnvfiAe9ES14m5RQ_2ECTQVH6"
          echo "Pingando $SUPABASE_URL ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/projetos?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP status: $HTTP_CODE"
          if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "ERRO: host nao resolvido."
            exit 1
          fi
          echo "OK: Supabase contatado, projeto mantido ativo."
